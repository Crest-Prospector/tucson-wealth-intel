<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tucson Wealth Intelligence</title>
<meta name="description" content="Real-data wealth heat map for Tucson, AZ with Census TIGER boundaries.">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="loader-ring"></div>
  <div id="loading-status">Initializing…</div>
</div>

<div id="root">
  <header id="topbar">
    <div class="brand"><div class="brand-icon">📍</div><div><div class="brand-name">TUCSON WEALTH INTEL</div><div class="brand-sub">Real Census Data · TIGER/Line Boundaries · 2024-2026</div></div></div>
    <div class="kpi-strip"><div class="kpi-item"><div class="kpi-val" id="kpi-avg">—</div><div class="kpi-lbl">Avg Score</div></div><div class="kpi-sep"></div><div class="kpi-item"><div class="kpi-val" id="kpi-top">—</div><div class="kpi-lbl">Top ZIP</div></div><div class="kpi-sep"></div><div class="kpi-item"><div class="kpi-val">$332K</div><div class="kpi-lbl">Metro Med.</div></div><div class="kpi-sep"></div><div class="kpi-item"><div class="kpi-val">$57K</div><div class="kpi-lbl">Med. Inc.</div></div><div class="kpi-sep"></div><div class="kpi-item"><div class="kpi-val" id="kpi-zones">—</div><div class="kpi-lbl">ZIPs</div></div></div>
    <div class="tb-controls">
      <div class="mode-group" id="mode-group">
        <button class="mode-btn on" data-mode="composite">Composite</button>
        <button class="mode-btn" data-mode="homes">Homes</button>
        <button class="mode-btn" data-mode="income">Income</button>
        <button class="mode-btn" data-mode="business">Business</button>
        <button class="mode-btn" data-mode="growth">Growth</button>
      </div>
      <button class="icon-btn on" id="labels-btn" title="Labels">Aa</button>
      <button class="icon-btn on" id="threed-btn" title="3D View">3D</button>
      <button class="icon-btn" id="compare-btn" title="Compare">⇌</button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div class="sb-head"><div class="sb-row"><span class="sb-title">ZIP Rankings</span><span class="sb-badge" id="sb-count">—</span></div><div class="search-wrap"><span class="si">⌕</span><input id="search" class="search-input" placeholder="Search ZIP or area…" autocomplete="off"></div></div>
      <div class="tier-row"><button class="tier-btn on" data-t="all">All</button><button class="tier-btn" data-t="high">High</button><button class="tier-btn" data-t="mid">Mid</button><button class="tier-btn" data-t="low">Low</button></div>
      <div class="zip-scroll" id="zip-list"></div>
    </aside>

    <div id="map-wrap">
      <div id="map"></div>
      <div id="style-bar"><button class="sty-btn active" data-style="dark">Dark</button><button class="sty-btn" data-style="satellite">Satellite</button><button class="sty-btn" data-style="streets">Streets</button><button class="sty-btn" data-style="outdoors">Terrain</button></div>
      <div id="legend"><div class="leg-lbl" id="leg-title">Composite Wealth Score</div><div class="leg-bar"></div><div class="leg-ticks"><span>Low</span><span>Mid</span><span>High</span></div><div class="leg-source">Census TIGER/Line ZCTA · ACS 2023 · Redfin · Zillow · CoStar</div></div>
      <div id="zoom-ctrl"><button id="z-in" class="z-btn">+</button><div class="z-sep"></div><button id="z-out" class="z-btn">−</button><div class="z-sep"></div><button id="z-reset" class="z-btn">⊙</button></div>

      <div id="detail">
        <div class="det-hd"><div><div class="det-zip" id="det-zip"></div><div class="det-name" id="det-name"></div><div class="det-city" id="det-city"></div></div><button id="det-close" class="det-x">✕</button></div>
        <div class="det-score-row"><div class="ring-wrap"><svg viewBox="0 0 64 64" class="ring-svg"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="5"/><circle id="ring-arc" cx="32" cy="32" r="26" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 32 32)"/></svg><div class="ring-num" id="ring-num"></div></div><div class="det-score-meta"><div class="dst-lbl">Wealth Score</div><div class="dst-tier" id="dst-tier"></div><div class="dst-rank" id="dst-rank"></div><div class="dst-opp" id="dst-opp"></div></div></div>
        <div id="det-body"></div>
      </div>

      <div id="cmp-bar"><span class="cmp-lbl">COMPARE</span><div class="cmp-slots"><div class="cmp-slot" id="cmp-a">Slot A</div><div class="cmp-vs">VS</div><div class="cmp-slot" id="cmp-b">Slot B</div></div><button id="cmp-run" disabled>Analyze →</button><button id="cmp-clear" class="cmp-clr">Clear</button></div>
    </div>
  </div>
</div>

<div id="cmp-modal" class="modal-bg"><div class="modal-box" id="cmp-box"></div></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
